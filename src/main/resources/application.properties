spring.application.name=spring-boot-ai-mcp-gateway
server.port=8080

# H2 Database In-Memory Configuration
spring.datasource.url=jdbc:h2:mem:enterprisedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# MCP Gateway Configuration
mcp.server.name=Enterprise-Spring-MCP-Gateway
mcp.server.version=1.0.0
mcp.security.enforce-read-only=true
mcp.security.max-rows-returned=100
mcp.security.query-timeout-seconds=5
mcp.transport.stdio-enabled=false

# Logging
logging.level.com.gateway.mcp=INFO
logging.level.org.springframework.web=INFO
